{% extends "layout/base.html" %}
{% block titulo %}{{ 'Editar curso' if editar else 'Agregar curso' }}{% endblock %}
{% block contenido %}
<form method="post" class="panel">
  <label>Nombre del curso <input name="nombre" required maxlength="100" value="{{ datos.nombre|default('') }}"></label>
  <label>Código de curso <input name="codigo" required maxlength="25" value="{{ datos.codigo|default('') }}"></label>
  <label>Cantidad de créditos <input name="creditos" type="number" min="1" max="999999999" required value="{{ datos.creditos|default('') }}"></label>
  <label>Carrera
    <select name="carrera_id" required>
      <option value="">Selecciona una carrera</option>
      {% for ca in carreras %}
        <option value="{{ ca.id }}" {% if datos.carrera_id|string == ca.id|string %}selected{% endif %}>{{ ca.nombre }}</option>
      {% endfor %}
    </select>
  </label>
  <div><button>Guardar curso</button> <a href="{{ url_for('cursos.lista') }}">Cancelar</a></div>
</form>
{% endblock %}
